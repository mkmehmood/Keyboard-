name: Build and Release Debug APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release Tag (e.g. v1.0.0)'
        required: false
        default: ''
      release_title:
        description: 'Release Title'
        required: false
        default: 'Gboard Replica Debug Release'
      is_prerelease:
        description: 'Mark as pre-release'
        type: boolean
        default: false
      is_draft:
        description: 'Create as draft'
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build & Publish Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false

      - name: Prepare Secrets & Keystore
        run: |
          # Create .env file from .env.example for Secrets Gradle Plugin
          if [ -f ".env.example" ]; then
            cp .env.example .env
          else
            touch .env
          fi

          # Decode or generate debug.keystore required by signingConfigs
          if [ -f "debug.keystore.base64" ]; then
            echo "Decoding debug.keystore from base64..."
            base64 -d debug.keystore.base64 > debug.keystore
          elif [ ! -f "debug.keystore" ]; then
            echo "Generating fresh debug.keystore..."
            keytool -genkey -v \
              -keystore debug.keystore \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi

          # Ensure gradlew has execute permissions
          chmod +x ./gradlew

      - name: Run Unit Tests
        run: ./gradlew :app:testDebugUnitTest --continue

      - name: Build Debug APK
        run: ./gradlew :app:assembleDebug --stacktrace

      - name: Package & Prepare Release Assets
        id: prepare_assets
        run: |
          OUTPUT_DIR="app/build/outputs/apk/debug"
          SOURCE_APK="$OUTPUT_DIR/app-debug.apk"

          if [ ! -f "$SOURCE_APK" ]; then
            echo "Error: Debug APK not found at $SOURCE_APK"
            exit 1
          fi

          # Determine Tag and Asset Name
          if [ -n "${{ github.event.inputs.tag_name }}" ]; then
            TAG="${{ github.event.inputs.tag_name }}"
          elif [ "${{ startsWith(github.ref, 'refs/tags/') }}" = "true" ]; then
            TAG="${GITHUB_REF#refs/tags/}"
          else
            TAG="v1.0.${{ github.run_number }}"
          fi

          ASSET_NAME="Gboard-Debug-$TAG.apk"
          cp "$SOURCE_APK" "$OUTPUT_DIR/$ASSET_NAME"
          cp "$SOURCE_APK" "$OUTPUT_DIR/Gboard-Debug.apk"

          # Generate SHA256 Checksum
          cd "$OUTPUT_DIR"
          sha256sum "$ASSET_NAME" > "$ASSET_NAME.sha256"
          sha256sum "Gboard-Debug.apk" > "Gboard-Debug.apk.sha256"
          cd -

          echo "release_tag=$TAG" >> $GITHUB_OUTPUT
          echo "apk_path=$OUTPUT_DIR/$ASSET_NAME" >> $GITHUB_OUTPUT
          echo "apk_name=$ASSET_NAME" >> $GITHUB_OUTPUT

      - name: Upload Debug APK Artifact (Run Assets)
        uses: actions/upload-artifact@v4
        with:
          name: Gboard-Debug-APK
          path: |
            app/build/outputs/apk/debug/*.apk
            app/build/outputs/apk/debug/*.sha256
          retention-days: 30

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.prepare_assets.outputs.release_tag }}
          name: ${{ github.event.inputs.release_title || steps.prepare_assets.outputs.release_tag }}
          draft: ${{ github.event.inputs.is_draft || false }}
          prerelease: ${{ github.event.inputs.is_prerelease || false }}
          generate_release_notes: true
          body: |
            ### 🚀 Gboard Android Keyboard Replica (Debug Build)
            
            This release contains the debug installable APK for **Gboard Replica with Unlimited Copy-Paste Clipboard**.
            
            #### 📱 Download & Install:
            - **Primary APK:** [`${{ steps.prepare_assets.outputs.apk_name }}`](https://github.com/${{ github.repository }}/releases/download/${{ steps.prepare_assets.outputs.release_tag }}/${{ steps.prepare_assets.outputs.apk_name }})
            - **Generic Name APK:** [`Gboard-Debug.apk`](https://github.com/${{ github.repository }}/releases/download/${{ steps.prepare_assets.outputs.release_tag }}/Gboard-Debug.apk)
            
            #### 🌟 Included Features:
            - **Google Material You QWERTY Layout** with tactile keycaps, borders, and magnifier pop-up bubbles.
            - **Unlimited Copy-Paste Clipboard Engine** backed by local Room SQLite database with permanent pinning and instant search.
            - **System Input Method Service (`GboardImeService`)** for cross-application system-wide keyboard input.
            - **Companion Activation Dashboard** with 1-tap Android settings activation and interactive testing sandbox.
            - **Voice Typing, Emoji Categories, Text Editing D-pad**, and 7 live selectable themes.
            
            *Automated build produced by GitHub Actions run #${{ github.run_number }}.*
          files: |
            app/build/outputs/apk/debug/${{ steps.prepare_assets.outputs.apk_name }}
            app/build/outputs/apk/debug/${{ steps.prepare_assets.outputs.apk_name }}.sha256
            app/build/outputs/apk/debug/Gboard-Debug.apk
            app/build/outputs/apk/debug/Gboard-Debug.apk.sha256
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
